name: Research fork checks

on:
  pull_request:
    branches:
      - research-base-v1.4.2
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      DO_NOT_TRACK: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24.14.0"
      - name: Enable the repository's pnpm version
        run: corepack enable pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Use the existing local frontend configuration
        run: |
          for app in web admin space live; do
            cp "apps/$app/.env.example" "apps/$app/.env"
          done
      - name: Check formatting, lint and types
        run: pnpm check --concurrency=2
      - name: Build all applications and packages
        run: pnpm build --concurrency=2

  backend:
    name: API lint, migrations and full test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: plane-research-ci-${{ github.run_id }}-${{ github.run_attempt }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/research-base-v1.4.2' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the repository's Ruff version
        run: python -m pip install ruff==0.9.7
      - name: Lint changed Python files
        run: |
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" HEAD -- 'apps/api/**/*.py' |
            xargs -0 --no-run-if-empty ruff check
      - name: Configure isolated test services without external inference
        run: |
          cp apps/api/.env.example apps/api/.env
          printf '\nSECRET_KEY=%s\nLLM_ALLOW_PAID_API=0\nLLM_BASE_URL=http://127.0.0.1:9/v1\n' \
            "$(openssl rand -hex 32)" >> apps/api/.env
      - name: Build the existing API test image
        run: docker compose -f docker-compose-test.yml build api-tests
      - name: Check migrations and run the full API suite
        run: |
          docker compose -f docker-compose-test.yml run --rm api-tests /bin/sh -c '
            set -e
            python manage.py makemigrations --check --dry-run
            python manage.py migrate db 0122 --noinput
            python manage.py migrate --noinput
            pytest --migrations --junitxml=/code/test-results.xml
          '
      - name: Show service logs after a failure
        if: failure()
        run: docker compose -f docker-compose-test.yml logs --no-color
      - name: Preserve API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: apps/api/test-results.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove isolated test services
        if: always()
        run: docker compose -f docker-compose-test.yml down --volumes --remove-orphans
