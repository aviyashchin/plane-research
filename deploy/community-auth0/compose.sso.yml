services:
  space:
    image: subconscious-projects-space:v1.4.2
    build:
      context: ./auth0
      dockerfile: Dockerfile.space
  web:
    image: subconscious-projects-web:v1.4.2
    build:
      context: ./auth0
      dockerfile: Dockerfile.web
  admin:
    image: plane-community-admin-auth0:v1.4.2
    build:
      context: ./auth0
      dockerfile: Dockerfile.admin
  api:
    image: plane-community-auth0:v1.4.2
    build:
      context: ./auth0
    env_file:
      - ./auth0.env
  proxy:
    volumes:
      - ./auth0/Caddyfile:/etc/caddy/Caddyfile:ro
